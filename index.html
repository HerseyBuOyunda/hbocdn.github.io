<!DOCTYPE html>

<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Herblox Network</title>

    

    <script src="https://herseybuoyunda.github.io/js.hbxcdn.github.io/core/herblox-guvenlik.js"></script>


    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            user-select: none;

        }


        body {

            background-color: #000000;

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

        }


        /* Ana Hata Paneli */

        .error-panel {

            background-color: #1b3145;

            width: 100%;

            padding: 60px 10%;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 80px;

            position: relative;

        }


        /* Sol Taraftaki Ünlem İkonu */

        .icon-container {

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .warning-icon {

            width: 180px;

            height: 160px;

            fill: none;

            stroke: #d16e6e;

            stroke-width: 6;

            stroke-linecap: round;

            stroke-linejoin: round;

        }


        /* Sağ Taraftaki Metin ve Buton Alanı */

        .content-container {

            display: flex;

            flex-direction: column;

            align-items: flex-start;

            max-width: 600px;

        }


        .error-title {

            color: #ffffff;

            font-size: 36px;

            font-weight: 500;

            margin-bottom: 20px;

        }


        .error-message {

            color: #b0c4de;

            font-size: 20px;

            line-height: 1.5;

            margin-bottom: 40px;

        }


        /* Mavi Çerçeveli Buton */

        .action-button {

            background-color: #0074bd;

            color: #000000;

            font-size: 20px;

            font-weight: 500;

            padding: 12px 80px;

            border: 4px solid #ffffff;

            cursor: pointer;

            outline: none;

            transition: all 0.1s ease;

        }


        .action-button:hover {

            background-color: #008be2;

            transform: scale(1.02);

        }

    </style>

</head>

<body>


    <div class="error-panel">

        <div class="icon-container">

            <svg class="warning-icon" viewBox="0 0 100 100">

                <polygon points="50,10 90,85 10,85"></polygon>

                <line x1="50" y1="35" x2="50" y2="60" stroke-width="7"></line>

                <circle cx="50" cy="73" r="4.5" fill="#d16e6e" stroke="none"></circle>

            </svg>

        </div>


        <div class="content-container">

            <h1 class="error-title">Erişim Engellendi</h1>

            <p class="error-message">

                Bu Site Herşey Bu Oyunda CDN Sitesidir<br>

                Hata Kodu: EE

            </p>

            <button class="action-button" onclick="window.history.back()">Tamam</button>

        </div>

    </div>


    <script>

        // Sayfa yüklendiğinde arka planda çalışan güvenlik kontrolünü test edelim

        document.addEventListener("DOMContentLoaded", function() {

            if (typeof window.GetHerbloxGuvenlikAnahtari === "function") {

                const aktifAnahtar = window.GetHerbloxGuvenlikAnahtari();

                console.log("🔒 [Herblox Secure] Oturum anahtarı doğrulandı: " + aktifAnahtar);

            }

        });

    </script>


</body>

</html>
